{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
  <div class="mx-auto w-full max-w-md">
    <div class="card border border-base-300 bg-base-200">
      <form method="post" class="card-body gap-4" novalidate>
        {% csrf_token %}
        <h1 class="card-title text-2xl">{{ title }}</h1>

        <fieldset class="fieldset">
          <label class="fieldset-legend" for="{{ form.name.id_for_label }}">Name</label>
          {{ form.name }}
          {% for error in form.name.errors %}
            <p class="text-sm text-error">{{ error }}</p>
          {% endfor %}
        </fieldset>

        <div class="flex flex-wrap gap-2">
          <button type="submit" class="btn btn-primary">Save</button>
          <a href="{% url 'hiring:skill_list' %}" class="btn btn-ghost">Cancel</a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}

{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
  <div class="mx-auto w-full max-w-2xl">
    <div class="card border border-base-300 bg-base-200">
      <form method="post" class="card-body gap-4" novalidate>
        {% csrf_token %}
        <h1 class="card-title text-2xl">{{ title }}</h1>

        {% for field in form %}
          <fieldset class="fieldset">
            <label class="fieldset-legend" for="{{ field.id_for_label }}">
              {{ field.label }}{% if not field.field.required %} <span class="font-normal text-base-content/70">(optional)</span>{% endif %}
            </label>
            {{ field }}
            {% for error in field.errors %}
              <p class="text-sm text-error">{{ error }}</p>
            {% endfor %}
          </fieldset>
        {% endfor %}

        <div class="flex flex-wrap gap-2">
          <button type="submit" class="btn btn-primary">Save</button>
          <a href="{% if candidate %}{% url 'hiring:candidate_detail' candidate.pk %}{% else %}{% url 'hiring:candidate_list' %}{% endif %}" class="btn btn-ghost">Cancel</a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}

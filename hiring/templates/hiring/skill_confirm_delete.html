{% extends "base.html" %}

{% block title %}Delete skill{% endblock %}

{% block content %}
  <div class="mx-auto w-full max-w-md">
    <div class="card border border-base-300 bg-base-200">
      <form method="post" class="card-body gap-4">
        {% csrf_token %}
        <h1 class="card-title text-2xl">Delete skill</h1>
        <p class="break-words">Delete the skill <strong>{{ skill.name }}</strong>? This can't be undone.</p>

        <div class="flex flex-wrap gap-2">
          <button type="submit" class="btn btn-error">Delete</button>
          <a href="{% url 'hiring:skill_list' %}" class="btn btn-ghost">Cancel</a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}

<header class="navbar border-b border-base-300 bg-base-200 px-4">
  <div class="navbar-start">
    {# Narrow screens: the links collapse into this menu. #}
    <div class="dropdown md:hidden">
      <div tabindex="0" role="button" class="btn btn-square btn-ghost" aria-label="Open menu">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </div>
      <ul tabindex="0" class="menu dropdown-content z-10 mt-3 w-56 rounded-box border border-base-300 bg-base-200 p-2 shadow-lg">
        {% include "_nav_links.html" %}
        <li class="menu-title truncate">{{ user.get_username }}</li>
        <li>
          <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="w-full text-left">Log out</button>
          </form>
        </li>
      </ul>
    </div>
    <a href="{% url 'hiring:pipeline' %}" class="btn btn-ghost text-lg">Hiring</a>
  </div>

  <nav class="navbar-center hidden md:flex" aria-label="Main">
    <ul class="menu menu-horizontal gap-1">
      {% include "_nav_links.html" %}
    </ul>
  </nav>

  <div class="navbar-end hidden gap-3 md:flex">
    <span class="max-w-40 truncate text-sm text-base-content/80">{{ user.get_username }}</span>
    <form method="post" action="{% url 'logout' %}">
      {% csrf_token %}
      <button type="submit" class="btn btn-outline btn-sm">Log out</button>
    </form>
  </div>
</header>
